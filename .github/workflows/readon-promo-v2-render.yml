name: Render READON promo V2

on:
  push:
    branches:
      - main
    paths:
      - "projects/readon-promo-v2/**"
      - ".github/workflows/readon-promo-v2-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/readon-promo-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare folders
        run: mkdir -p out public/screens public/audio

      - name: Capture READON production UI
        run: npm run capture
        env:
          READON_URL: https://memora-sentences.itisnowornever271.workers.dev

      - name: Fetch AI voiceover
        run: npm run fetch:voice

      - name: Generate BGM and SFX
        run: npm run generate:sfx

      - name: Inspect audio inputs
        run: |
          for f in public/audio/*; do
            echo "=== $f ==="
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f" || true
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Render QA stills
        run: npm run stills

      - name: Render final MP4
        run: npm run render

      - name: Inspect rendered media
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_name,codec_type,width,height,r_frame_rate \
            -of json out/readon-promo-v2.mp4 > out/ffprobe.json
          cat out/ffprobe.json

      - name: Upload READON promo V2
        uses: actions/upload-artifact@v4
        with:
          name: readon-promo-v2
          path: |
            projects/readon-promo-v2/out/
            projects/readon-promo-v2/public/screens/
          if-no-files-found: error
          retention-days: 14
