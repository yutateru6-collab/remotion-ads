name: Render READON promo V3

on:
  push:
    branches:
      - main
    paths:
      - "projects/readon-promo-v3/**"
      - "skills/readon-promo-director/**"
      - ".github/workflows/readon-promo-v3-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/readon-promo-v3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare folders
        run: mkdir -p out public/screens public/audio

      - name: Capture production UI
        run: npm run capture
        env:
          READON_URL: https://memora-sentences.itisnowornever271.workers.dev

      - name: Fetch AI voice
        run: npm run fetch:voice

      - name: Generate BGM and SFX
        run: npm run generate:sfx

      - name: Verify Japanese font packages
        run: |
          test -d node_modules/@fontsource/zen-kaku-gothic-new
          test -d node_modules/@fontsource/biz-udpgothic
          echo "Japanese self-hosted fonts are installed"

      - name: Typecheck
        run: npm run typecheck

      - name: Render QA stills
        run: npm run stills

      - name: Render final MP4
        run: npm run render

      - name: Inspect media
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_name,codec_type,width,height,r_frame_rate \
            -of json out/readon-promo-v3.mp4 > out/ffprobe.json
          cat out/ffprobe.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: readon-promo-v3
          path: |
            projects/readon-promo-v3/out/
            projects/readon-promo-v3/public/screens/
          if-no-files-found: error
          retention-days: 14
